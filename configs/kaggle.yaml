# configs/kaggle.yaml
# Kaggle GPU training config for Research Corpus v2
# Shared codebase with local training — only runtime settings differ

# ──────────────────────────────────────────────────────────────────────────────
# Inherits base model/optimizer from pretrain_research_v2.yaml
# This file only overrides Kaggle-specific runtime settings
# ──────────────────────────────────────────────────────────────────────────────

# ── Kaggle runtime ────────────────────────────────────────────────────────────
kaggle:
  # Dataset slug on Kaggle (owner/dataset-slug)
  dataset_slug: "research-v2-corpus"

  # Kernel settings
  kernel_name: "research-v2-pretrain"
  kernel_title: "LLM Pretrain - Research Corpus v2"

  # GPU selection (T4 is free tier, P100/L4 more capable)
  # Options: "T4", "P100", "L4", "gpu" (any available)
  gpu_type: "T4"

  # Max runtime in hours (Kaggle limit: 12h for GPU kernels)
  max_runtime_hours: 12

  # Internet access (needed for HuggingFace downloads if corpus not uploaded)
  enable_internet: true

  # Auto-detect and resume from latest checkpoint
  auto_resume: true

  # Output dataset slug for saving results
  output_dataset_slug: "pretrain-results"

# ── Model (matches pretrain_research_v2.yaml) ────────────────────────────────
model:
  vocab_size: 32000
  d_model: 576
  n_heads: 8
  n_layers: 6
  d_ff: 2304
  dropout: 0.0
  max_seq_len: 2048
  norm_type: "rmsnorm"
  activation: "swiglu"
  rope: true
  rope_base: 10000.0
  flash_attention: true       # Enabled on CUDA (Kaggle GPUs support it)
  gradient_checkpointing: true
  tie_weights: false
  bias: false

# ── Tokenizer ─────────────────────────────────────────────────────────────────
tokenizer:
  type: "sentencepiece"
  vocab_size: 32000
  model_path: "/kaggle/input/research-v2-corpus/tokenizer/tokenizer.model"

# ── Dataset (paths adjusted for Kaggle) ───────────────────────────────────────
dataset:
  path: "/kaggle/input/research-v2-corpus/corpus.jsonl"
  max_seq_len: 2048
  train_split: 0.95
  val_split: 0.05
  num_workers: 2
  pin_memory: true
  packing: true
  pack_factor: 4

# ── Training (optimized for CUDA) ─────────────────────────────────────────────
training:
  optimizer: "muon"
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  momentum: 0.95
  grad_clip: 1.0

  scheduler: "cosine"
  warmup_steps: 500           # Shorter warmup for Kaggle (time-limited)
  max_steps: 50000

  # batch_size / gradient_accumulation_steps: omit to auto-detect by GPU
  # T4/P100 (16GB): batch=4, accum=8 | L4 (24GB): batch=8, accum=4 | A100: batch=16, accum=2

  dtype: "bf16"                # CUDA supports bf16 (T4: yes, P100: fp16 only)
  compile: true                # torch.compile works well on CUDA

  use_ema: true
  ema_decay: 0.9999

  save_every: 500
  keep_last_n: 3
  checkpoint_dir: "checkpoints"

  log_every: 25
  tensorboard: true
  wandb: false

  eval_every: 500
  eval_steps: 50

  experiment_dir: "experiments"

  nan_recovery: true
  nan_max_retries: 3
  nan_skip_batches: 10

  spike_detection: true
  spike_threshold: 2.0
  spike_window: 100
  spike_rollback: true

  seed: 42

# ── Checkpoint recovery ──────────────────────────────────────────────────────
checkpoint_recovery:
  # Local directory for checkpoint sync
  local_checkpoint_dir: "training/checkpoints/kaggle"

  # Auto-download checkpoints when they appear on Kaggle
  auto_download: true

  # Auto-upload local checkpoints on resume
  auto_upload: true

  # Keep only last N checkpoints locally
  keep_local_n: 5

# ── Evaluation ────────────────────────────────────────────────────────────────
evaluation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  num_samples: 5
  prompts:
    - "def fibonacci(n):"
    - "The quick brown fox"
    - "import numpy as np"
    - "Explain quantum computing"
    - "What is machine learning?"
