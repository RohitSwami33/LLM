mode: local                          # local mode recommended for production training
seed: 42

preprocessing:
  remove_empty: true
  remove_html: true
  normalize_unicode: true
  normalize_whitespace: true
  deduplicate: true
  min_length: 50
  max_length: 100000
  filter_language: null

datasets:
  FineWeb:
    documents: 200000000             # ~200M docs from sample-10BT / full FineWeb
  Wikipedia:
    documents: 6500000               # full English Wikipedia
  TheStack:
    languages:
      - Python
      - JavaScript
      - TypeScript
      - Go
      - Rust
      - Java
      - C
      - C++
    documents: 20000000
  Dolma:
    documents: 100000000

output:
  format: arrow                      # Arrow format for large-scale training
  path: datasets/mixtures/large
  save_tokenizer_data: true
