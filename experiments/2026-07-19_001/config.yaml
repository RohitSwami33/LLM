model:
  vocab_size: 32000
  d_model: 576
  n_heads: 8
  n_layers: 6
  d_ff: 2304
  dropout: 0.0
  max_seq_len: 1024
  norm_type: rmsnorm
  activation: swiglu
  rope: true
  rope_base: 10000.0
  flash_attention: false
  gradient_checkpointing: true
  tie_weights: false
  bias: false
tokenizer:
  type: sentencepiece
  vocab_size: 32000
  model_path: training/tokenizer/pretrain_tokenizer.model
dataset:
  path: datasets/mixtures/tiny/corpus.jsonl
  max_seq_len: 1024
  val_split: 0.05
  num_workers: 2
  pin_memory: false
training:
  optimizer: muon
  learning_rate: 0.0003
  min_lr: 3.0e-05
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  momentum: 0.95
  grad_clip: 1.0
  scheduler: cosine
  warmup_steps: 200
  max_steps: 2000
  eval_every: 200
  save_every: 500
  log_every: 50
  batch_size: 4
  gradient_accumulation_steps: 8
  dtype: fp32
  compile: false
  use_ema: true
  ema_decay: 0.9999
  checkpoint_dir: training/checkpoints
  keep_last_n: 3
  log_dir: training/logs
  experiment_dir: experiments
  tensorboard: true
  csv: true
  wandb: false
  eval_steps: 50
  nan_recovery: true
  nan_max_retries: 3
  nan_skip_batches: 10
  early_stop_patience: 0
  early_stop_min_delta: 1e-4
  spike_detection: true
  spike_threshold: 2.0
  spike_window: 50
  spike_rollback: true
  seed: 42
evaluation:
  max_new_tokens: 150
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  num_samples: 3
  prompts:
  - The history of artificial intelligence begins with
  - In quantum computing, the fundamental unit is
  - Python is a programming language that
