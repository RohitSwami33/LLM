# training/configs/base.yaml
# Base configuration for 50-70M parameter decoder-only transformer

# ──────────────────────────────────────────────────────────────────────────────
# MODEL
# ──────────────────────────────────────────────────────────────────────────────
model:
  vocab_size: 32000           # Set after tokenizer training
  d_model: 576                # Hidden dimension (~60M params)
  n_heads: 8                  # Attention heads (72 per head)
  n_layers: 6                 # Transformer blocks
  d_ff: 2304                  # FFN dimension (SwiGLU)
  dropout: 0.0                # Embedding / attention dropout
  max_seq_len: 2048           # Maximum sequence length
  norm_type: "rmsnorm"        # "rmsnorm" | "layernorm"
  activation: "swiglu"        # "swiglu"  | "gelu"
  rope: true                  # Rotary positional embeddings
  rope_base: 10000.0          # RoPE base frequency
  flash_attention: true       # FlashAttention 2
  gradient_checkpointing: true
  tie_weights: false
  bias: false

# ──────────────────────────────────────────────────────────────────────────────
# TOKENIZER
# ──────────────────────────────────────────────────────────────────────────────
tokenizer:
  type: "sentencepiece"       # "sentencepiece" | "huggingface"
  vocab_size: 32000
  model_path: "training/tokenizer/tokenizer.model"

# ──────────────────────────────────────────────────────────────────────────────
# DATASET
# ──────────────────────────────────────────────────────────────────────────────
dataset:
  path: "datasets/synthetic/v1/dataset.jsonl"
  max_seq_len: 2048
  train_split: 0.9
  val_split: 0.1
  num_workers: 4
  pin_memory: true

  # Sequence packing
  packing: false
  pack_factor: 4

# ──────────────────────────────────────────────────────────────────────────────
# TRAINING
# ──────────────────────────────────────────────────────────────────────────────
training:
  # Optimizer
  optimizer: "muon"
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  momentum: 0.95
  grad_clip: 1.0

  # Schedule
  scheduler: "cosine"
  warmup_steps: 2000
  max_steps: 100000

  # Batch size
  batch_size: 8
  gradient_accumulation_steps: 4

  # Mixed precision
  dtype: "bf16"
  compile: true

  # EMA
  use_ema: true
  ema_decay: 0.9999

  # Checkpointing
  save_every: 5000
  keep_last_n: 3

  # Logging
  log_every: 100
  tensorboard: true
  wandb: false
  wandb_project: "deepseek-baseline"

  # Validation
  eval_every: 500
  eval_steps: 100

  # ──────────────────────────────────────────────────────────────────────────
  # EXPERIMENT TRACKING
  # ──────────────────────────────────────────────────────────────────────────
  experiment_dir: "experiments"   # Root directory for all experiments

  # ──────────────────────────────────────────────────────────────────────────
  # STABILITY FEATURES
  # ──────────────────────────────────────────────────────────────────────────
  nan_recovery: true
  nan_max_retries: 3
  nan_skip_batches: 10

  early_stop_patience: 0
  early_stop_min_delta: 1e-4

  spike_detection: true
  spike_threshold: 2.0
  spike_window: 100
  spike_rollback: true

  # Seed
  seed: 42

# ──────────────────────────────────────────────────────────────────────────────
# EVALUATION
# ──────────────────────────────────────────────────────────────────────────────
evaluation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  num_samples: 3
  prompts:
    - "Explain quantum computing in simple terms."
    - "Write a Python function to sort a list of numbers."
    - "What are the benefits of regular exercise?"
    - "Describe the process of photosynthesis."
    - "How does a neural network learn?"
