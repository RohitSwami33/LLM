# training/configs/pretrain_small.yaml
# Baseline pretraining: 1B token budget on SMALL mixture
# MacBook Air M4 (16 GB)

# ──────────────────────────────────────────────────────────────────────────────
# MODEL — identical architecture (no changes)
# ──────────────────────────────────────────────────────────────────────────────
model:
  vocab_size: 32768
  d_model: 576
  n_heads: 8
  n_layers: 6
  d_ff: 2304
  dropout: 0.0
  max_seq_len: 1024
  norm_type: "rmsnorm"
  activation: "swiglu"
  rope: true
  rope_base: 10000.0
  flash_attention: false
  gradient_checkpointing: true
  tie_weights: false
  bias: false

# ──────────────────────────────────────────────────────────────────────────────
# TOKENIZER
# ──────────────────────────────────────────────────────────────────────────────
tokenizer:
  type: "sentencepiece"
  vocab_size: 32768
  model_path: "training/tokenizer/small_tokenizer.model"

# ──────────────────────────────────────────────────────────────────────────────
# DATASET
# ──────────────────────────────────────────────────────────────────────────────
dataset:
  path: "datasets/mixtures/small/corpus.jsonl"
  max_seq_len: 1024
  val_split: 0.02
  num_workers: 2
  pin_memory: false

# ──────────────────────────────────────────────────────────────────────────────
# TRAINING — 1B token budget
# ──────────────────────────────────────────────────────────────────────────────
training:
  optimizer: "muon"
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  momentum: 0.95
  grad_clip: 1.0

  scheduler: "cosine"
  warmup_steps: 500

  # Token budget: 1B tokens
  # effective_batch_size = batch_size * grad_accum = 4 * 8 = 32
  # tokens_per_step = 32 * 1024 = 32768
  # steps_for_1B = 1e9 / 32768 ≈ 30518
  max_tokens: 1000000000
  max_steps: 31000

  # Batch size — tuned for 16 GB MPS
  batch_size: 4
  gradient_accumulation_steps: 8

  # Mixed precision — FP32 on MPS
  dtype: "fp32"
  compile: false

  # EMA
  use_ema: true
  ema_decay: 0.9999

  # Checkpointing
  checkpoint_dir: "training/checkpoints"
  keep_last_n: 3
  save_every_tokens: 100000000   # Save every 100M tokens

  # Evaluation
  eval_every_tokens: 50000000    # Eval every 50M tokens
  eval_steps: 100

  # Logging
  log_dir: "training/logs"
  experiment_dir: "experiments"
  tensorboard: true
  csv: true
  wandb: false
  log_every: 100

  # Early stopping
  early_stop_patience: 5
  early_stop_min_delta: 0.001

  # Stability
  nan_recovery: true
  nan_max_retries: 3
  nan_skip_batches: 10
  spike_detection: true
  spike_threshold: 2.0
  spike_window: 100
  spike_rollback: true

  seed: 42

# ──────────────────────────────────────────────────────────────────────────────
# EVALUATION
# ──────────────────────────────────────────────────────────────────────────────
evaluation:
  max_new_tokens: 200
  temperature: 0.8
  top_k: 50
  top_p: 0.95
  num_samples: 5
  prompts:
    - "The history of artificial intelligence begins with"
    - "In quantum computing, the fundamental unit is"
    - "Python is a programming language that"
    - "The theory of general relativity describes"
    - "def fibonacci(n):"
